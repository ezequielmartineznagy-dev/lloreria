<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Llorería</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #080e1a;
      overflow: hidden;
      color: #c9d8f0;
    }

    /* ── RAIN ── */
    .rain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .drop {
      position: absolute;
      top: -120px;
      width: 1.5px;
      border-radius: 2px;
      background: linear-gradient(to bottom, transparent, rgba(120, 170, 255, 0.55));
      animation: fall linear infinite;
    }

    @keyframes fall {
      to { transform: translateY(110vh); }
    }

    /* ── LAYOUT ── */
    .scene {
      position: relative;
      z-index: 1;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    /* ── CARD ── */
    .card {
      background: rgba(10, 20, 50, 0.55);
      backdrop-filter: blur(18px) saturate(1.4);
      -webkit-backdrop-filter: blur(18px) saturate(1.4);
      border: 1px solid rgba(100, 150, 255, 0.18);
      border-radius: 24px;
      padding: 2.4rem 2.6rem 2.8rem;
      width: min(520px, 94vw);
      box-shadow:
        0 8px 40px rgba(0, 0, 0, 0.55),
        0 0 0 0.5px rgba(120, 160, 255, 0.08) inset,
        0 0 60px rgba(70, 110, 255, 0.04) inset;
    }

    /* ── TITLE ── */
    .title {
      text-align: center;
      font-size: 2.1rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #a8c4ff;
      text-shadow: 0 0 22px rgba(100, 160, 255, 0.45);
      margin-bottom: 0.3rem;
    }

    .subtitle {
      text-align: center;
      font-size: 0.82rem;
      color: rgba(160, 190, 255, 0.45);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 2rem;
    }

    /* ── TEXTAREA ── */
    .queja-wrap {
      position: relative;
      margin-bottom: 1.8rem;
    }

    textarea {
      width: 100%;
      resize: none;
      background: rgba(8, 18, 48, 0.6);
      border: 1.5px solid rgba(100, 150, 255, 0.22);
      border-radius: 14px;
      padding: 1rem 1.1rem;
      color: #c9d8f0;
      font-size: 0.97rem;
      font-family: inherit;
      line-height: 1.55;
      height: 110px;
      transition: border-color 0.25s, box-shadow 0.25s;
      outline: none;
    }

    textarea::placeholder {
      color: rgba(140, 170, 240, 0.38);
    }

    textarea:focus {
      border-color: rgba(130, 170, 255, 0.55);
      box-shadow: 0 0 0 3px rgba(100, 150, 255, 0.12), 0 0 20px rgba(100, 150, 255, 0.08);
    }

    .char-count {
      position: absolute;
      bottom: 9px;
      right: 13px;
      font-size: 0.72rem;
      color: rgba(140, 170, 240, 0.35);
      pointer-events: none;
      transition: color 0.2s;
    }

    .char-count.warning { color: rgba(255, 160, 100, 0.7); }
    .char-count.limit   { color: rgba(255, 90, 90, 0.8); }

    /* ── SLIDER SECTION ── */
    .slider-section {
      margin-bottom: 2rem;
    }

    .slider-label {
      text-align: center;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: #8aaeff;
      text-shadow: 0 0 12px rgba(100, 160, 255, 0.35);
      margin-bottom: 0.75rem;
      min-height: 1.2em;
      transition: all 0.3s ease;
    }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }

    .slider-emoji {
      font-size: 1.45rem;
      flex-shrink: 0;
      filter: drop-shadow(0 0 6px rgba(100, 160, 255, 0.3));
      transition: transform 0.2s;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      flex: 1;
      height: 6px;
      border-radius: 99px;
      background: rgba(80, 120, 255, 0.2);
      outline: none;
      cursor: pointer;
      transition: background 0.3s;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #7aaeff;
      box-shadow:
        0 0 0 3px rgba(100, 160, 255, 0.2),
        0 0 14px rgba(100, 160, 255, 0.5);
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    input[type="range"]::-moz-range-thumb {
      width: 20px;
      height: 20px;
      border: none;
      border-radius: 50%;
      background: #7aaeff;
      box-shadow:
        0 0 0 3px rgba(100, 160, 255, 0.2),
        0 0 14px rgba(100, 160, 255, 0.5);
      cursor: pointer;
    }

    input[type="range"]:active::-webkit-slider-thumb {
      transform: scale(1.2);
      box-shadow:
        0 0 0 5px rgba(100, 160, 255, 0.2),
        0 0 22px rgba(100, 160, 255, 0.65);
    }

    /* ── BUTTON ── */
    .btn-llorar {
      width: 100%;
      padding: 0.9rem;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #2a4dbb 0%, #1a3496 100%);
      color: #c9d8ff;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      box-shadow:
        0 4px 18px rgba(40, 80, 220, 0.35),
        0 0 0 1px rgba(120, 160, 255, 0.15) inset;
      transition: transform 0.18s, box-shadow 0.18s, background 0.18s;
    }

    .btn-llorar::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.07) 0%, transparent 60%);
      pointer-events: none;
    }

    .btn-llorar:hover {
      transform: translateY(-2px);
      box-shadow:
        0 8px 30px rgba(40, 80, 220, 0.55),
        0 0 0 1.5px rgba(150, 190, 255, 0.25) inset,
        0 0 40px rgba(80, 130, 255, 0.15);
      background: linear-gradient(135deg, #3460d8 0%, #2244b8 100%);
    }

    .btn-llorar:active {
      transform: translateY(0);
      box-shadow:
        0 2px 10px rgba(40, 80, 220, 0.35),
        0 0 0 1px rgba(120, 160, 255, 0.12) inset;
    }

    .btn-llorar.crying {
      animation: shake 0.35s ease;
    }

    @keyframes shake {
      0%,100% { transform: translateX(0) }
      20%      { transform: translateX(-5px) }
      40%      { transform: translateX(5px) }
      60%      { transform: translateX(-4px) }
      80%      { transform: translateX(4px) }
    }

    /* ── REACTION ── */
    .reaction {
      margin-top: 1.2rem;
      text-align: center;
      font-size: 0.88rem;
      color: rgba(160, 190, 255, 0.55);
      min-height: 1.4em;
      transition: opacity 0.4s;
      opacity: 0;
    }

    .reaction.visible { opacity: 1; }

    /* ── LLOROS AREA ── */
    .lloros-area {
      margin-top: 1.4rem;
      min-height: 120px;
      max-height: 220px;
      overflow-y: auto;
      overflow-x: hidden;
      position: relative;
      border-top: 1px solid rgba(100, 150, 255, 0.1);
      padding-top: 1rem;
      scrollbar-width: thin;
      scrollbar-color: rgba(100, 150, 255, 0.2) transparent;
    }

    .lloros-area::-webkit-scrollbar { width: 4px; }
    .lloros-area::-webkit-scrollbar-track { background: transparent; }
    .lloros-area::-webkit-scrollbar-thumb { background: rgba(100,150,255,0.2); border-radius: 99px; }

    .lloros-row {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 0.7rem;
      padding: 0.2rem 0.2rem 0.6rem;
    }

    /* ── LAGRIMA FLOAT WRAPPER ── */
    .lagrima-float {
      flex-shrink: 0;
      will-change: transform;
    }

    /* ── LAGRIMA BURBUJA ── */
    .lagrima {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      background: rgba(70, 130, 255, 0.1);
      border: 1px solid rgba(140, 190, 255, 0.22);
      box-shadow:
        0 0 14px rgba(100, 160, 255, 0.18),
        inset 0 1px 0 rgba(200, 220, 255, 0.12);
      cursor: grab;
      flex-shrink: 0;
      animation: lagrima-drop 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
      transition: box-shadow 0.2s, transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: transform;
      user-select: none;
      -webkit-user-select: none;
    }

    .lagrima:hover {
      box-shadow:
        0 0 24px rgba(100, 170, 255, 0.5),
        0 0 8px rgba(160, 210, 255, 0.3),
        inset 0 1px 0 rgba(200, 220, 255, 0.2);
    }

    .lagrima:active { cursor: grabbing; }

    .lagrima.popping {
      animation: lagrima-pop 0.35s cubic-bezier(0.22, 1, 0.36, 1) forwards !important;
    }

    @keyframes lagrima-drop {
      0%   { opacity: 0; transform: translateY(-18px) scale(0.7); }
      60%  { opacity: 1; transform: translateY(4px) scale(1.05); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes lagrima-pop {
      0%   { transform: scale(1);   opacity: 1; }
      45%  { transform: scale(1.5); opacity: 0.7; }
      100% { transform: scale(0.6); opacity: 0; }
    }

    @keyframes float {
      0%   { transform: translate(0px, 0px) rotate(0deg); }
      25%  { transform: translate(var(--fx), calc(var(--fy) * -1)) rotate(1deg); }
      50%  { transform: translate(0px, 0px) rotate(0deg); }
      75%  { transform: translate(calc(var(--fx) * -0.65), var(--fy)) rotate(-1deg); }
      100% { transform: translate(0px, 0px) rotate(0deg); }
    }

    .lagrima-inner {
      font-size: 1.4rem;
      line-height: 1;
      filter: drop-shadow(0 0 5px rgba(120, 180, 255, 0.55));
      transition: transform 0.2s, filter 0.2s;
      pointer-events: none;
    }

    .lagrima:hover .lagrima-inner {
      transform: scale(1.2);
      filter: drop-shadow(0 0 10px rgba(130, 210, 255, 0.9));
    }

    /* ── WAVE RIPPLE ── */
    .wave-ripple {
      position: absolute;
      border-radius: 50%;
      border: 1.5px solid rgba(120, 180, 255, 0.5);
      box-shadow: 0 0 8px rgba(100, 160, 255, 0.2);
      pointer-events: none;
      transform: scale(0);
      opacity: 1;
      animation: wave-expand 0.85s ease-out forwards;
    }

    @keyframes wave-expand {
      to { transform: scale(1); opacity: 0; }
    }

    /* ── TOOLTIP ── */
    .lagrima .tooltip {
      position: absolute;
      bottom: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%) scale(0.9);
      background: rgba(8, 16, 44, 0.92);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(100, 150, 255, 0.25);
      border-radius: 10px;
      padding: 0.45rem 0.75rem;
      font-size: 0.78rem;
      color: #c9d8f0;
      white-space: nowrap;
      max-width: 220px;
      white-space: normal;
      text-align: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.18s, transform 0.18s;
      z-index: 20;
      box-shadow: 0 4px 18px rgba(0,0,0,0.4), 0 0 12px rgba(100,160,255,0.1);
    }

    .lagrima .tooltip::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border: 5px solid transparent;
      border-top-color: rgba(100, 150, 255, 0.25);
    }

    .lagrima:hover .tooltip {
      opacity: 1;
      transform: translateX(-50%) scale(1);
    }

    .lloros-empty {
      text-align: center;
      color: rgba(140, 170, 240, 0.28);
      font-size: 0.8rem;
      padding: 1.2rem 0;
      letter-spacing: 0.04em;
    }

    /* ── PSICÓLOGO ── */
    .psicologo-wrap {
      display: flex;
      align-items: flex-end;
      gap: 0.75rem;
      margin-top: 1rem;
      padding-top: 0.85rem;
      border-top: 1px solid rgba(100, 150, 255, 0.08);
      min-height: 60px;
    }

    .psi-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      flex-shrink: 0;
    }

    .psicologo-char {
      width: 40px;
      height: 50px;
      background: linear-gradient(160deg, #6ab0ff 0%, #3a7bdd 100%);
      border-radius: 50% 50% 48% 48% / 58% 58% 42% 42%;
      position: relative;
      box-shadow:
        0 0 16px rgba(100, 170, 255, 0.4),
        inset 0 2px 0 rgba(255,255,255,0.2);
      animation: psi-bob 2.6s ease-in-out infinite;
      cursor: default;
    }

    .psi-face {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .psi-eyes {
      display: flex;
      gap: 7px;
    }

    .psi-eyes span {
      width: 6px;
      height: 7px;
      background: #fff;
      border-radius: 50%;
      position: relative;
    }

    .psi-eyes span::after {
      content: '';
      position: absolute;
      width: 3px;
      height: 3px;
      background: #1a3080;
      border-radius: 50%;
      top: 1px;
      left: 1.5px;
    }

    .psi-mouth {
      width: 13px;
      height: 7px;
      border: 2.5px solid rgba(255,255,255,0.9);
      border-top: none;
      border-radius: 0 0 10px 10px;
    }

    .psi-label {
      font-size: 0.6rem;
      color: rgba(140, 175, 255, 0.38);
      text-align: center;
      line-height: 1.3;
      letter-spacing: 0.02em;
    }

    @keyframes psi-bob {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      40%       { transform: translateY(-5px) rotate(-2deg); }
      70%       { transform: translateY(-3px) rotate(1.5deg); }
    }

    .psicologo-bubble {
      flex: 1;
      position: relative;
      background: rgba(8, 20, 58, 0.78);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(100, 155, 255, 0.22);
      border-radius: 14px 14px 14px 4px;
      padding: 0.6rem 0.85rem;
      font-size: 0.79rem;
      color: #bdd2ff;
      line-height: 1.5;
      opacity: 0;
      transform: translateY(8px) scale(0.95);
      transition: opacity 0.35s, transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
      pointer-events: none;
      min-height: 2.6rem;
      display: flex;
      align-items: center;
      box-shadow: 0 4px 18px rgba(0,0,0,0.3), 0 0 10px rgba(80,130,255,0.08);
    }

    .psicologo-bubble.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .psicologo-bubble::before {
      content: '';
      position: absolute;
      left: -6px;
      bottom: 12px;
      border-top: 5px solid transparent;
      border-bottom: 5px solid transparent;
      border-right: 7px solid rgba(100, 155, 255, 0.22);
    }

    /* ── PARTÍCULAS CELEBRACIÓN ── */
    .cel-particle {
      position: fixed;
      pointer-events: none;
      z-index: 50;
      animation: cel-fly var(--dur) ease-out forwards;
    }

    @keyframes cel-fly {
      0%   { transform: translate(0, 0) scale(1) rotate(0deg);   opacity: 1; }
      100% { transform: translate(var(--tx), var(--ty)) scale(0.2) rotate(var(--rot)); opacity: 0; }
    }

    /* ── CARD SHAKE ── */
    @keyframes card-shake {
      0%,100% { transform: translateX(0) rotate(0deg); }
      15%     { transform: translateX(-5px) rotate(-0.5deg); }
      30%     { transform: translateX(5px)  rotate(0.5deg); }
      50%     { transform: translateX(-3px) rotate(-0.3deg); }
      70%     { transform: translateX(3px); }
      85%     { transform: translateX(-1px); }
    }

    .card.celebrating { animation: card-shake 0.42s ease both; }

    /* ── FLOATING TEARS ── */
    .tear {
      position: fixed;
      font-size: 1.3rem;
      pointer-events: none;
      z-index: 10;
      animation: tearFall 1.4s ease-in forwards;
    }

    @keyframes tearFall {
      0%   { transform: translateY(0) scale(1); opacity: 1; }
      100% { transform: translateY(180px) scale(0.4); opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- Rain -->
  <div class="rain" id="rain"></div>

  <div class="scene">
    <div class="card">
      <h1 class="title">Llorería 💧</h1>
      <p class="subtitle">Quejas aceptadas las 24 hs</p>

      <!-- Textarea -->
      <div class="queja-wrap">
        <textarea
          id="queja"
          maxlength="120"
          placeholder="¿De qué te querés quejar hoy?"
          spellcheck="false"
        ></textarea>
        <span class="char-count" id="charCount">0 / 120</span>
      </div>

      <!-- Slider -->
      <div class="slider-section">
        <div class="slider-label" id="sliderLabel">meh</div>
        <div class="slider-row">
          <span class="slider-emoji" id="emojiLeft">😢</span>
          <input type="range" id="dolor" min="0" max="100" value="15" />
          <span class="slider-emoji" id="emojiRight">🧅</span>
        </div>
      </div>

      <!-- Botón -->
      <button class="btn-llorar" id="btnLlorar">Llorar</button>

      <div class="reaction" id="reaction"></div>

      <!-- Lloros acumulados -->
      <div class="lloros-area" id="llorosArea">
        <div class="lloros-row" id="llorosRow">
          <div class="lloros-empty" id="llorosEmpty">Acá van a vivir tus lloros. 💧</div>
        </div>
      </div>

      <!-- Psicólogo -->
      <div class="psicologo-wrap">
        <div class="psi-col">
          <div class="psicologo-char" id="psicologoChar">
            <div class="psi-face">
              <div class="psi-eyes"><span></span><span></span></div>
              <div class="psi-mouth"></div>
            </div>
          </div>
          <p class="psi-label">El Psicólogo<br>de la Llorería</p>
        </div>
        <div class="psicologo-bubble" id="psicologoBubble">
          <span id="psicologoText"></span>
        </div>
      </div>
    </div>
  </div>

  <script>
    /* ── RAIN GENERATOR ── */
    (function () {
      const rain = document.getElementById('rain');
      const COUNT = 80;

      for (let i = 0; i < COUNT; i++) {
        const drop = document.createElement('div');
        drop.className = 'drop';

        const left     = Math.random() * 100;
        const height   = 60 + Math.random() * 80;
        const duration = 1.4 + Math.random() * 2.2;
        const delay    = -(Math.random() * duration);
        const opacity  = 0.25 + Math.random() * 0.45;

        drop.style.cssText = `
          left: ${left}%;
          height: ${height}px;
          opacity: ${opacity};
          animation-duration: ${duration}s;
          animation-delay: ${delay}s;
        `;
        rain.appendChild(drop);
      }
    })();

    /* ── CHAR COUNTER ── */
    const queja     = document.getElementById('queja');
    const charCount = document.getElementById('charCount');

    queja.addEventListener('input', () => {
      const len = queja.value.length;
      charCount.textContent = `${len} / 120`;
      charCount.className = 'char-count' +
        (len >= 100 ? (len >= 115 ? ' limit' : ' warning') : '');
    });

    /* ── SLIDER ── */
    const slider     = document.getElementById('dolor');
    const sliderLabel= document.getElementById('sliderLabel');
    const emojiLeft  = document.getElementById('emojiLeft');
    const emojiRight = document.getElementById('emojiRight');

    const LABELS = [
      { max: 30,  text: 'meh' },
      { max: 70,  text: 'dolor' },
      { max: 100, text: 'nivel cebolla 🧅' },
    ];

    function updateSlider () {
      const val = parseInt(slider.value, 10);
      const pct = val / 100;

      const label = LABELS.find(l => val <= l.max);
      sliderLabel.textContent = label ? label.text : 'nivel cebolla 🧅';

      // fill track
      const color = `rgba(${lerp(80,60,pct)}, ${lerp(120,100,pct)}, ${lerp(255,200,pct)}, 0.45)`;
      slider.style.background =
        `linear-gradient(to right, rgba(100,160,255,0.7) ${val}%, ${color} ${val}%)`;

      // scale emojis subtly
      emojiLeft.style.transform  = `scale(${1 + (1-pct) * 0.2})`;
      emojiRight.style.transform = `scale(${1 + pct * 0.2})`;
    }

    function lerp(a, b, t) { return Math.round(a + (b - a) * t); }

    slider.addEventListener('input', updateSlider);
    updateSlider();

    /* ── BUTTON ── */
    const btn      = document.getElementById('btnLlorar');
    const reaction = document.getElementById('reaction');

    const REACTIONS = [
      'Ahí, bien. Soltalo todo. 💧',
      'El universo recibió tu queja. No le importó, pero la recibió.',
      'Estadísticamente, alguien en el mundo también está llorando. Solidaridad.',
      'La cebollas también lloran. Son valientes.',
      'Tu queja fue archivada en la carpeta "pendiente de resolver desde 1998".',
      'El dolor compartido es dolor a medias. El tuyo sigue siendo tuyo, igual.',
      'Llorar hidrata. Eso dicen.',
      'Procesando emociones… error 404: solución no encontrada. 💙',
      'Muy bien. ¿Querés llorar de nuevo o lo dejamos acá?',
      'Tu queja fue recibida con el respeto y la indiferencia que merece el universo.',
    ];

    btn.addEventListener('click', () => {
      btn.classList.remove('crying');
      void btn.offsetWidth;
      btn.classList.add('crying');

      spawnTears();

      const texto      = queja.value.trim();
      const intensidad = parseInt(slider.value, 10);
      guardarLloro(texto, intensidad);
      renderLloros();

      queja.value = '';
      charCount.textContent = '0 / 120';
      charCount.className = 'char-count';

      const msg = REACTIONS[Math.floor(Math.random() * REACTIONS.length)];
      reaction.textContent = msg;
      reaction.classList.add('visible');

      // ── nuevas funciones ──
      mostrarPsicologo();
      celebrar();
      animarBoton();

      btn.addEventListener('animationend', () => btn.classList.remove('crying'), { once: true });
    });

    /* ── LLOROS STORE ── */
    const lloros = [];

    function crearId () {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    }

    function guardarLloro (texto, intensidad) {
      lloros.push({ id: crearId(), texto, intensidad });
    }

    function elegirEmoji (intensidad) {
      if (intensidad <= 30) return '💧';
      if (intensidad <= 70) return '😢';
      return '🧅';
    }

    function renderLloros () {
      const row   = document.getElementById('llorosRow');
      const empty = document.getElementById('llorosEmpty');
      const lloro = lloros[lloros.length - 1];

      if (lloros.length === 0) return;
      if (empty) empty.remove();

      // ── tamaño según intensidad ──
      const size = 36 + Math.round(lloro.intensidad * 0.28);

      // ── float wrapper ──
      const floatEl = document.createElement('div');
      floatEl.className = 'lagrima-float';

      // parámetros únicos de flotación
      const fx  = (3 + Math.random() * 5).toFixed(1) + 'px';
      const fy  = (2 + Math.random() * 4).toFixed(1) + 'px';
      const dur = (3.5 + Math.random() * 3).toFixed(2) + 's';
      const del = -(Math.random() * 3).toFixed(2) + 's';

      floatEl.style.cssText = `
        --fx: ${fx}; --fy: ${fy};
        animation: float ${dur} ease-in-out ${del} infinite;
      `;

      // ── lagrima ──
      const el = document.createElement('div');
      el.className = 'lagrima';
      el.dataset.id = lloro.id;
      el.style.width  = `${size}px`;
      el.style.height = `${size * 1.15}px`;
      el.style.marginLeft = `${Math.floor(Math.random() * 55)}px`;

      const inner = document.createElement('span');
      inner.className = 'lagrima-inner';
      inner.textContent = elegirEmoji(lloro.intensidad);

      const tip = document.createElement('div');
      tip.className = 'tooltip';
      tip.textContent = lloro.texto || '(sin palabras, solo llanto)';

      el.appendChild(inner);
      el.appendChild(tip);
      floatEl.appendChild(el);
      row.appendChild(floatEl);

      // interacciones
      agregarPop(el);
      agregarDrag(el, floatEl);

      const area = document.getElementById('llorosArea');
      area.scrollTop = area.scrollHeight;
    }

    /* ── POP AL CLICK ── */
    function agregarPop (el) {
      el.addEventListener('click', (e) => {
        if (el._dragged) return; // no pop si fue arrastre
        el.classList.remove('popping');
        void el.offsetWidth;
        el.classList.add('popping');
        el.addEventListener('animationend', () => {
          el.classList.remove('popping');
        }, { once: true });
      });
    }

    /* ── DRAG CON RETORNO ELÁSTICO ── */
    function agregarDrag (el, floatEl) {
      let startX = 0, startY = 0, curX = 0, curY = 0, dragging = false;

      el.addEventListener('mousedown', (e) => {
        e.preventDefault();
        dragging = true;
        el._dragged = false;
        startX = e.clientX - curX;
        startY = e.clientY - curY;
        el.style.transition = 'box-shadow 0.2s';
        floatEl.style.animationPlayState = 'paused';
      });

      document.addEventListener('mousemove', (e) => {
        if (!dragging) return;
        curX = e.clientX - startX;
        curY = e.clientY - startY;
        if (Math.abs(curX) > 4 || Math.abs(curY) > 4) el._dragged = true;
        el.style.transform = `translate(${curX}px, ${curY}px)`;
      });

      document.addEventListener('mouseup', () => {
        if (!dragging) return;
        dragging = false;
        // retorno elástico
        el.style.transition = 'transform 0.55s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.2s';
        el.style.transform = 'translate(0px, 0px)';
        curX = 0; curY = 0;
        floatEl.style.animationPlayState = 'running';
        setTimeout(() => { el._dragged = false; }, 80);
      });

      // touch
      el.addEventListener('touchstart', (e) => {
        const t = e.touches[0];
        dragging = true; el._dragged = false;
        startX = t.clientX - curX; startY = t.clientY - curY;
        floatEl.style.animationPlayState = 'paused';
      }, { passive: true });

      el.addEventListener('touchmove', (e) => {
        if (!dragging) return;
        const t = e.touches[0];
        curX = t.clientX - startX; curY = t.clientY - startY;
        if (Math.abs(curX) > 4 || Math.abs(curY) > 4) el._dragged = true;
        el.style.transform = `translate(${curX}px, ${curY}px)`;
      }, { passive: true });

      el.addEventListener('touchend', () => {
        dragging = false;
        el.style.transition = 'transform 0.55s cubic-bezier(0.22, 1, 0.36, 1)';
        el.style.transform = 'translate(0px, 0px)';
        curX = 0; curY = 0;
        floatEl.style.animationPlayState = 'running';
      });
    }

    /* ── ONDA AL CLICK EN EL ÁREA ── */
    (function () {
      const area = document.getElementById('llorosArea');
      area.addEventListener('click', (e) => {
        const rect  = area.getBoundingClientRect();
        const x     = e.clientX - rect.left;
        const y     = e.clientY - rect.top + area.scrollTop;
        const size  = 120;
        const wave  = document.createElement('div');
        wave.className = 'wave-ripple';
        wave.style.cssText = `
          width: ${size}px; height: ${size}px;
          left: ${x - size / 2}px;
          top: ${y - size / 2}px;
        `;
        area.appendChild(wave);
        wave.addEventListener('animationend', () => wave.remove());
      });
    })();

    /* ── PSICÓLOGO ── */
    const PSICOLOGO_RESPONSES = [
      'Entiendo perfectamente... aunque no sé qué entendí exactamente 😭',
      'Tu tristeza fue recibida oficialmente por la Llorería 💧',
      'He analizado tu problema durante 3 segundos y mi conclusión es: necesitás una galletita.',
      'Recuerda: hasta las nubes lloran y siguen siendo bonitas ☁️',
      'Diagnóstico: mucho lloro. Tratamiento: probablemente un abrazo.',
      'Esto es muy serio. Voy a anotarlo en mi cuaderno imaginario 📓',
      'Respirá hondo. ¿Ya? Bien. Ahora llorá un poco más, que te hace bien.',
      '¡Qué valiente sos por llorar! Los héroes también lloran. Y los antihéroes. Y las cebollas.',
      'Según mis estudios de 0 años en psicología, esto tiene solución. No sé cuál. Pero tiene.',
      'He visto casos peores. Bueno, no los he visto. Pero me los imagino.',
      'Tu lloro fue registrado en el Gran Libro de los Lloros de la Humanidad 📖',
      'Como diría alguien muy sabio: "a veces las cosas son así". Muy sabio, sí.',
      'Propongo que te tomes el día. No? ¿Tampoco? Ok. Propongo un vaso de agua entonces.',
      'El universo escuchó tu queja y dijo "mmm, interesante" y siguió girando igual.',
      'Diagnóstico oficial: sos una persona con sentimientos. ¡Qué noticia tan humana!',
      '¿Sabías que llorar libera toxinas? Bueno, creo que leí eso en algún lado. O lo soñé.',
      'Esto también pasará. No sé cuándo. Pero pasará. O no. Igual, ánimo 💙',
      'Mi recomendación profesional: tres respiras, un té, y ver un video de ositos.',
      'Anotado, procesado, archivado y ligeramente olvidado. Con mucho amor 💧',
      'Eso que sentís se llama... un sentimiento. Y los sentimientos son... sentimentales.',
      'No estás solo/a. Yo estoy acá. Soy una gotita de agua, pero estoy acá.',
      'En base a tu intensidad, recomiendo entre 1 y 47 galletitas. A tu criterio.',
      'Tu queja entró al Departamento de Quejas. Estamos en fila. Somos todos 💧',
      '¡Excelente decisión llorar hoy! Mañana también podés. Es gratis.',
      'Lo que describís suena muy difícil. O fácil. No soy el mejor juez de estas cosas.',
      'Un abrazo virtual de mi parte. Lamentablemente soy líquido y no tengo brazos.',
      'Esto lo resolverías con una buena siesta. ¿Ya probaste con una buena siesta?',
    ];

    let psicologoTimer = null;

    function mostrarPsicologo () {
      const bubble = document.getElementById('psicologoBubble');
      const text   = document.getElementById('psicologoText');
      const char   = document.getElementById('psicologoChar');

      const resp = PSICOLOGO_RESPONSES[Math.floor(Math.random() * PSICOLOGO_RESPONSES.length)];

      // pequeño rebote del personaje
      char.style.animation = 'none';
      void char.offsetWidth;
      char.style.animation = 'psi-bob 2.6s ease-in-out infinite';

      bubble.classList.remove('visible');
      clearTimeout(psicologoTimer);

      setTimeout(() => {
        text.textContent = resp;
        bubble.classList.add('visible');
        psicologoTimer = setTimeout(() => bubble.classList.remove('visible'), 7000);
      }, 180);
    }

    /* ── CELEBRACIÓN ── */
    const CEL_EMOJIS = ['💧', '😢', '✨', '🫧', '💦', '🌧️'];

    function celebrar () {
      const card = document.querySelector('.card');
      card.classList.remove('celebrating');
      void card.offsetWidth;
      card.classList.add('celebrating');
      card.addEventListener('animationend', () => card.classList.remove('celebrating'), { once: true });

      const rect = btn.getBoundingClientRect();
      const cx   = rect.left + rect.width / 2;
      const cy   = rect.top  + rect.height / 2;
      const n    = 10 + Math.floor(parseInt(slider.value, 10) / 12);

      for (let i = 0; i < n; i++) {
        const p   = document.createElement('div');
        p.className = 'cel-particle';
        p.textContent = CEL_EMOJIS[Math.floor(Math.random() * CEL_EMOJIS.length)];

        const angle = Math.random() * Math.PI * 2;
        const dist  = 60 + Math.random() * 110;
        const tx    = Math.round(Math.cos(angle) * dist);
        const ty    = Math.round(Math.sin(angle) * dist - 40);
        const dur   = (0.7 + Math.random() * 0.6).toFixed(2) + 's';
        const rot   = (Math.random() * 360 - 180).toFixed(0) + 'deg';
        const delay = (Math.random() * 0.18).toFixed(2) + 's';

        p.style.cssText = `
          left: ${cx}px; top: ${cy}px;
          font-size: ${0.8 + Math.random() * 0.6}rem;
          --tx: ${tx}px; --ty: ${ty}px;
          --dur: ${dur}; --rot: ${rot};
          animation-delay: ${delay};
        `;
        document.body.appendChild(p);
        p.addEventListener('animationend', () => p.remove());
      }
    }

    /* ── TEXTO DINÁMICO DEL BOTÓN ── */
    const BTN_LABELS = [
      'Llorado con éxito 💧',
      'Descarga emocional completada 😭',
      'Lloro enviado al océano',
      'Emoción procesada ✔️',
      '¡Llorado! ¿Más? 💦',
      'Queja archivada en el cosmos',
    ];

    function animarBoton () {
      const label = BTN_LABELS[Math.floor(Math.random() * BTN_LABELS.length)];
      btn.textContent = label;
      btn.disabled = true;
      setTimeout(() => {
        btn.textContent = 'Llorar';
        btn.disabled = false;
      }, 2200);
    }

    /* ── SPAWN TEARS ── */
    function spawnTears () {
      const rect = btn.getBoundingClientRect();
      const cx   = rect.left + rect.width / 2;
      const cy   = rect.top;
      const n    = 5 + Math.floor(parseInt(slider.value, 10) / 20);

      for (let i = 0; i < n; i++) {
        const tear = document.createElement('div');
        tear.className = 'tear';
        tear.textContent = '💧';
        const x = cx + (Math.random() - 0.5) * rect.width * 1.2;
        tear.style.left = `${x}px`;
        tear.style.top  = `${cy}px`;
        tear.style.animationDelay = `${Math.random() * 0.25}s`;
        document.body.appendChild(tear);
        tear.addEventListener('animationend', () => tear.remove());
      }
    }
  </script>
</body>
</html>
